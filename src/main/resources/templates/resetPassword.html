<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Reset Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        background-color: #1a1a1a; /* culoarea de fundal */
        color: #f0c040; /* culoarea textului */
        font-family: "Arial", sans-serif; /* fontul */
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        padding: 20px;
        box-sizing: border-box;
      }
      .container {
        background-color: #2a2a2a; /* fundalul formularului */
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        width: 100%;
        max-width: 400px; /* lățimea maximă a formularului */
        text-align: center;
      }
      h2 {
        margin-bottom: 20px;
        font-weight: bold;
      }
      label {
        display: block;
        margin: 10px 0;
      }
      input[type="password"] {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 4px;
        margin-bottom: 20px;
        box-sizing: border-box;
      }
      button {
        background-color: #f0c040; /* culoarea butonului */
        color: #1a1a1a; /* textul butonului */
        border: none;
        padding: 10px 15px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        width: 100%;
      }
      button:hover {
        background-color: #d4b030; /* culoare buton la hover */
      }

      @media (max-width: 480px) {
        .container {
          padding: 10px;
        }
        h2 {
          font-size: 20px;
        }
        input[type="password"],
        button {
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Reset Password</h2>
      <form th:action="@{/auth/setPassword}" method="post">
        <input type="hidden" name="token" th:value="${token}" />
        <label for="password">New Password:</label>
        <input type="password" id="password" name="password" required />
        <button type="submit">Reset Password</button>
      </form>
    </div>
  </body>
</html>
